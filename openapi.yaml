openapi: 3.0.4
info:
  title: Earnings Report
  description: >-
    Earnings Report returns a company's complete financial statements - income
    statement, balance sheet and cash flow together - in a single call from SEC
    filings, making it a one-stop earnings API for fundamental stock data. Look
    up by ticker or CIK; paid plans add calculated margins and year and quarter
    filters. For a single focused statement, see the Income Statement, Balance
    Sheet, Cash Flow and Financial Ratios APIs.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/earnings:
    get:
      summary: Earnings Report
      description: >-
        Get earnings and financial data for a company by ticker symbol.
        Optionally filter by year and quarter.
      operationId: earnings
      parameters:
        - name: ticker
          in: query
          schema:
            type: string
          required: true
          description: Stock ticker symbol (e.g. AAPL, MSFT, ADBE)
          example: ADBE
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: Fiscal year to retrieve. Defaults to latest available.
        - name: quarter
          in: query
          schema:
            type: integer
          required: false
          description: Fiscal quarter to retrieve. Defaults to latest available.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ticker: ADBE
                  company: ADOBE INC.
                  cik: '0000796343'
                  fiscalYear: 2026
                  fiscalQuarter: 2
                  filingType: 10-Q
                  filingDate: '2026-06-15'
                  periodEnd: '2026-05-29'
                  income:
                    revenue: 6618000000
                    costOfRevenue: 715000000
                    grossProfit: 5903000000
                    operatingIncome: 2238000000
                    netIncome: 1712000000
                    eps: 4.25
                    epsBasic: 4.26
                    sharesOutstanding: 402500000
                    sharesOutstandingBasic: 402400000
                    researchAndDevelopment: null
                    sellingAndMarketing: 1884000000
                    sellingGeneralAndAdmin: null
                    generalAndAdmin: 546000000
                    interestExpense: null
                    incomeTax: 526000000
                    depreciation: 367000000
                    stockBasedCompensation: 1043000000
                  balance:
                    totalAssets: 29933000000
                    currentAssets: 9068000000
                    cash: 4919000000
                    receivables: 1993000000
                    inventory: null
                    propertyAndEquipment: 1870000000
                    goodwill: 14041000000
                    intangibles: 1012000000
                    totalLiabilities: 18415000000
                    currentLiabilities: 12078000000
                    accountsPayable: 499000000
                    longTermDebt: 4802000000
                    equity: 11518000000
                    retainedEarnings: 48767000000
                  cashFlow:
                    operatingCashFlow: 5123000000
                    capitalExpenditures: 95000000
                    freeCashFlow: 5028000000
                    investingCashFlow: -1240000000
                    financingCashFlow: -4399000000
                    dividendsPaid: null
                    shareRepurchases: 4589000000
                  dividends: null
                  lastUpdated: '2026-07-17T23:01:47.364Z'
                  metrics:
                    grossMargin: 89.2
